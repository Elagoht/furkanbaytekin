{{stylesheet "/static/pages/404.css"}}
<main>
  <section class="error-page">
    <div class="error-container">
      <div class="error-code" aria-hidden="true">{{.Code}}</div>
      <div class="error-divider" role="presentation"></div>
      <h1 class="error-title">{{.Heading}}</h1>
      <p class="error-message">{{.Message}}</p>
      <div class="error-actions">
        {{- range .Actions}}
        <a class="btn btn-{{.Variant}}" href="{{.Href}}">{{.Label}}</a>
        {{- end}}
      </div>
    </div>
  </section>
</main>
